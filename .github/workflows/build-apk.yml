name: Build Release APK

# Builds a signed (debug-keystore) release APK locally on GitHub's runner.
# No Expo EAS account or login is required.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner image ships the Android SDK with pre-accepted licenses;
      # AGP auto-installs missing platform/build-tools components.
      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (generate native android project)
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle (wrapper + dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'android/settings.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        env:
          CI: 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache --parallel

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanakkam-tv-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
